groups:
  - name: aegis-infrastructure-alerts
    rules:

      - alert: InstanceDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is down"
          description: "Node Exporter on {{ $labels.instance }} has been unavailable for more than 1 minute."

      - alert: HighCPUUsage
        expr: |
          100 * (1 - avg by (instance) (
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          )) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage on {{ $labels.instance }} has exceeded 80% for 5 minutes."

      - alert: HighMemoryUsage
        expr: |
          100 * (1 - (
            node_memory_MemAvailable_bytes /
            node_memory_MemTotal_bytes
          )) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage on {{ $labels.instance }} has exceeded 85% for 5 minutes."

      - alert: LowDiskSpace
        expr: |
          100 * (
            node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
          ) < 15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space detected"
          description: "Root filesystem available space on {{ $labels.instance }} is below 15%."
